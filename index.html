<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Prompt Launcher</title><style>html,body{margin:0;background:#070b12;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#94a3b8;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#6f92ff;box-shadow:0 0 18px #6f92ff;margin-right:8px;display:inline-block}</style></head><body><div class="boot"><span><i class="dot"></i>Nalaganje launcherja …</span></div><script>const polish=`<style id="visual-polish">:root{--bg:#070b12;--panel:#0f1724;--field:#091320;--border:rgba(121,146,181,.20);--text:#f5f7fb;--muted:#8f9daf;--accent:#6f92ff;--danger:#ef5b67;--ok:#2ed684;--shadow:0 22px 60px rgba(0,0,0,.34)}body{background:radial-gradient(circle at 14% -5%,rgba(111,146,255,.16),transparent 28%),radial-gradient(circle at 92% 8%,rgba(86,215,255,.07),transparent 26%),linear-gradient(180deg,#070b12,#0a101b)!important;letter-spacing:-.01em}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent 78%)}.shell{position:relative}.mark{background:linear-gradient(145deg,#56d7ff,#6f92ff 52%,#8c6cff)!important;box-shadow:0 8px 22px rgba(86,215,255,.13),0 8px 28px rgba(111,146,255,.24)!important}.eyebrow{letter-spacing:.12em!important;color:#9ba8ba!important}.brand h1{letter-spacing:-.045em!important;text-shadow:0 1px 0 rgba(255,255,255,.03)}.btn{background:linear-gradient(180deg,rgba(22,32,49,.94),rgba(15,24,38,.94))!important;border-color:rgba(121,146,181,.20)!important;transition:.16s ease!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.btn:hover{transform:translateY(-1px);background:linear-gradient(180deg,#1b2940,#132033)!important;border-color:rgba(130,160,205,.32)!important}.btn.primary{background:linear-gradient(135deg,#6f92ff,#5c7cff 55%,#6f6cff)!important;border-color:rgba(125,157,255,.75)!important;box-shadow:0 7px 20px rgba(91,124,255,.18)!important}.panel{background:linear-gradient(180deg,rgba(16,24,38,.95),rgba(10,17,28,.96))!important;border-color:rgba(121,146,181,.20)!important;box-shadow:0 22px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.025)!important;backdrop-filter:blur(16px)}.divider{background:linear-gradient(90deg,transparent,rgba(130,160,205,.32),transparent)!important}.tpl{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(20,30,47,.98),rgba(16,25,40,.98))!important;border-color:rgba(121,146,181,.20)!important;transition:.17s ease!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.018)}.tpl:hover{transform:translateY(-1px);border-color:rgba(130,160,205,.32)!important;background:linear-gradient(145deg,#18253a,#121d2e)!important}.tpl.active{border-color:rgba(111,146,255,.78)!important;background:linear-gradient(145deg,rgba(28,44,73,.98),rgba(22,31,51,.98))!important;box-shadow:inset 3px 0 0 #6f92ff,0 8px 20px rgba(30,68,140,.10)!important}.tpl.active:after{content:"";position:absolute;right:-16px;top:-18px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,rgba(86,215,255,.15),transparent 68%);pointer-events:none}.field input,.field select,.field textarea{background:linear-gradient(180deg,rgba(9,18,31,.98),rgba(8,15,26,.98))!important;border-color:rgba(121,146,181,.20)!important;transition:.15s ease!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.018)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6f92ff!important;box-shadow:0 0 0 3px rgba(111,146,255,.11),0 0 18px rgba(86,215,255,.04)!important}.prompt{background:radial-gradient(circle at 100% 0%,rgba(86,215,255,.035),transparent 24%),linear-gradient(180deg,#07101d,#08111e)!important;border-color:rgba(121,146,181,.20)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}.live:before{background:#2ed684!important;box-shadow:0 0 10px rgba(46,214,132,.48)}#editor{background:linear-gradient(180deg,rgba(12,21,35,.98),rgba(9,17,29,.98))!important;border-color:rgba(111,146,255,.25)!important;box-shadow:0 22px 60px rgba(0,0,0,.34),inset 0 0 0 1px rgba(86,215,255,.018)!important}.side,.emain{background:linear-gradient(180deg,rgba(15,25,40,.98),rgba(12,21,34,.98))!important;border-color:rgba(121,146,181,.20)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}.eitem{background:linear-gradient(180deg,#111b2b,#0f1928)!important;border-color:rgba(121,146,181,.20)!important;transition:.15s ease}.eitem:hover{border-color:rgba(130,160,205,.32)!important}.eitem.sel{border-color:#6f92ff!important;background:linear-gradient(145deg,#1a2b47,#14233a)!important;box-shadow:inset 3px 0 0 #6f92ff,0 6px 16px rgba(28,65,135,.10)!important}.tab{transition:.15s ease}.tab.active{background:linear-gradient(180deg,#21385f,#1b2f50)!important;border-color:#567eb8!important;box-shadow:0 5px 14px rgba(53,96,160,.12)}.fcard{background:linear-gradient(180deg,#0d1725,#0b1421)!important;border-color:rgba(121,146,181,.20)!important}.banner.show{background:linear-gradient(90deg,rgba(16,36,67,.86),rgba(13,24,42,.76))!important;border-color:rgba(90,140,220,.36)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}dialog{background:linear-gradient(180deg,#101724,#0c1420)!important;border-color:rgba(121,146,181,.20)!important}</style>`;fetch('/app.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('app');return r.text()}).then(html=>{html=html.replace('</head>',polish+'</head>');document.open();document.write(html);document.close()}).catch(()=>{document.querySelector('.boot').innerHTML='<span>Launcherja ni bilo mogoče naložiti. Osveži stran.</span>'});</script></body></html>
